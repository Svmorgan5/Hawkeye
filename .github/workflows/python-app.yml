name: Hawkeye CI      # ← project name

on:
  push:
    branches: [ main, dev ]   # run pipeline for either branch

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: us-east-2
  S3_BUCKET: tech-res-project-hawkeye   # dummy bucket for Moto

# ────────────────────────── BUILD ──────────────────────────
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application (placeholder)
        run: echo "🔨 Building application …"

# ────────────────────────── TEST ───────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov moto[s3] requests

      - name: Run pytest suite
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ env.S3_BUCKET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -m "not live_s3" --cov=backend --cov-report=term-missing

# ───────────────────────── DEPLOY ──────────────────────────
  deploy:
    needs: test
    if: github.ref == 'refs/heads/dev'      # deploy **only** when dev passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies (for any build‑time tasks)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key:    ${{ secrets.RENDER_API_KEY }}
